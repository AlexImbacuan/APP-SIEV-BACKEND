spring.application.name=demo

spring.datasource.url=jdbc:postgresql://db.pgzrgvsobajdmoxhspyk.supabase.co:5432/postgres
spring.datasource.username=postgres
# La contraseña se lee de la variable de entorno SPRING_DATASOURCE_PASSWORD (Render / IntelliJ)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Obligatoria: sin valor por defecto para que nadie pueda firmar tokens con una clave conocida
jwt.secret=${JWT_SECRET}

# Usuario SUPERADMIN inicial (lo crea InicializadorDatos al arrancar si ambas variables existen)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Subida de archivos (PDF de cotizaciones de Siigo). Los archivos no se guardan, solo se leen.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI: APAGADO por defecto para que nunca quede expuesto en producción.
# Para usarlo en local, define la variable de entorno SWAGGER_HABILITADO=true
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:false}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:false}

# Orígenes permitidos por CORS, separados por comas
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,https://sievsas.com,https://www.sievsas.com}

# API de Siigo (temporal, para explorar datos). Opcionales: sin ellas la app arranca igual
# y los endpoints /api/siigo responden 503.
siigo.username=${SIIGO_USERNAME:}
siigo.access-key=${SIIGO_ACCESS_KEY:}
siigo.partner-id=${SIIGO_PARTNER_ID:SIEV}

# Sincronización de cotizaciones de Siigo a la tabla siigo_cotizacion (hora de Colombia).
# Formato cron de Spring: segundo minuto hora día mes día-semana. "-" la desactiva.
siigo.sincronizacion.cron=${SIIGO_SYNC_CRON:0 0 6,13 * * *}
# Si la última falló, reintenta cada hora (minuto 30), máximo 6 veces seguidas
siigo.sincronizacion.reintento-cron=${SIIGO_SYNC_REINTENTO_CRON:0 30 * * * *}
# Al arrancar, sincroniza si la última exitosa tiene más de 12 horas
siigo.sincronizacion.al-arrancar=${SIIGO_SYNC_AL_ARRANCAR:true}
