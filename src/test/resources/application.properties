# Configuración SOLO para tests: reemplaza a src/main/resources/application.properties
# Usa H2 en memoria para no tocar la base de datos real (Supabase).
spring.application.name=demo-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=test
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=clave-de-pruebas-solo-para-tests-0123456789-abcdefghijklmnopqrstuvwxyz

admin.email=admin@test.com
admin.password=Admin-Test-123

app.cors.origenes=http://localhost:3000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger encendido en los tests para verificar que funciona
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Siigo: sin credenciales y sin sincronización automática en los tests
siigo.sincronizacion.cron=-
siigo.sincronizacion.reintento-cron=-
siigo.sincronizacion.al-arrancar=false
